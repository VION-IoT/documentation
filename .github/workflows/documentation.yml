# Build and publish the VION documentation image, then deploy to AKS.
#
# Tag scheme (docker/metadata-action@v5 does the bookkeeping):
#   - Push to main            -> :main + :main-{sha7}
#   - Push tag vX.Y.Z         -> :X.Y.Z + :latest
#   - Push tag vX.Y.Z-preview -> :X.Y.Z-preview (no :latest)
#   - Pull request            -> build only, no push
#   - workflow_dispatch       -> :manual-{sha7}
#
# Deploy routing:
#   - Push to main (the :main-{sha7} build) -> test cluster
#   - Stable tag vX.Y.Z (the :X.Y.Z build)  -> production cluster (reviewer-gated env)
#   - Pre-release tags, PR builds, and workflow_dispatch do not auto-deploy.
#
# Cut a release the same way the dale runtime does (see dale/docs/releasing.md):
#   gh release create v0.1.0 --target main --generate-notes \
#     --title "v0.1.0" --notes "Short release summary."
name: Documentation

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: vionimages.azurecr.io/documentation

jobs:
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'

      - uses: pnpm/action-setup@v4
        with:
          version: '^10.0.0'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run audit

      - run: pnpm run build

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # - main + main-{sha}        on main branch pushes
          # - vX.Y.Z (stripped 'v')    on semver tag pushes
          # - latest                   only on non-pre-release semver tags
          # - manual-{sha}             on workflow_dispatch
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
            type=raw,value=main-{{sha}},enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=manual-{{sha}},enable=${{ github.event_name == 'workflow_dispatch' }}
          flavor: |
            latest=false

      - uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: vionimages.azurecr.io
          username: ${{ secrets.VIONIMAGES_ACR_USERNAME }}
          password: ${{ secrets.VIONIMAGES_ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-test:
    # Fires on every push to main. Pre-release tags and PRs do not deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, vpn]
    needs: build-docker
    environment: test
    permissions:
      id-token: write   # required for OIDC token exchange with Azure AD
      contents: read
    defaults:
      run:
        shell: pwsh   # self-hosted runner is Windows; use PowerShell (bash on this host resolves to WSL)
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      - name: Update deployment image
        run: |
          $TAG = "main-$($env:GITHUB_SHA.Substring(0,7))"
          kubectl set image deployment/documentation "documentation=${env:IMAGE}:$TAG" -n documentation
          kubectl rollout status deployment/documentation -n documentation --timeout=5m
          Write-Host "Deployed ${env:IMAGE}:$TAG"

  deploy-prod:
    # Fires on stable semver tags only (vX.Y.Z, not vX.Y.Z-preview.N).
    # The `production` environment should require a reviewer approval.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    runs-on: [self-hosted, vpn]
    needs: build-docker
    environment: production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      - name: Determine version
        id: version
        run: |
          $version = $env:GITHUB_REF -replace '^refs/tags/v',''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Update deployment image
        run: |
          $version = '${{ steps.version.outputs.version }}'
          kubectl set image deployment/documentation "documentation=${env:IMAGE}:$version" -n documentation
          kubectl rollout status deployment/documentation -n documentation --timeout=5m
          Write-Host "Deployed ${env:IMAGE}:$version"
