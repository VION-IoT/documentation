# Build and publish the VION documentation image, then deploy to AKS.
#
# Tag scheme (computed by VION-IoT/shared-workflows/actions/docker-tags@v1):
#   - push to main            -> :main + :main-{sha7}
#   - push tag vX.Y.Z         -> :X.Y.Z (+ :latest on stable)
#   - push tag vX.Y.Z-preview -> :X.Y.Z-preview (no :latest)
#   - workflow_dispatch       -> :manual-{sha7}
#   - pull_request            -> build only, no push
#
# Deploy routing:
#   - push to main            -> test cluster (deploys :main-{sha7})
#   - stable tag vX.Y.Z       -> production cluster (deploys :X.Y.Z)
#   - everything else         -> no auto-deploy
#
# Cut a release: gh release create vX.Y.Z --target main --generate-notes
name: Documentation

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: vionimages.azurecr.io/documentation

jobs:
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # Tag-only output (e.g. "main-abc1234" or "1.2.3"). Empty for
      # non-deploying events. Tag-only on purpose: passing the full
      # image ref vionimages.azurecr.io/documentation:<tag> as an output
      # collides with GitHub's "skip output containing secret" mechanism
      # because VIONIMAGES_ACR_USERNAME is "vionimages" — the registry's
      # short name appears in the URL. Caller assembles the full ref
      # inline in its `with:` block.
      deploy-tag: ${{ steps.deploy-ref.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'

      - uses: pnpm/action-setup@v4
        with:
          version: '^10.0.0'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run audit
      - run: pnpm run build

      - uses: VION-IoT/shared-workflows/actions/docker-tags@v1
        id: meta
        with:
          images: ${{ env.IMAGE }}

      - id: deploy-ref
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* && ! "$GITHUB_REF" == *-* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == push ]]; then
            echo "tag=main-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: vionimages.azurecr.io
          username: ${{ secrets.VIONIMAGES_ACR_USERNAME }}
          password: ${{ secrets.VIONIMAGES_ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-docker
    permissions:
      id-token: write   # required by deploy-aks.yml for OIDC Azure login
      contents: read
    uses: VION-IoT/shared-workflows/.github/workflows/deploy-aks.yml@v1
    with:
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
      cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
      deployment: documentation
      container: documentation
      image: vionimages.azurecr.io/documentation:${{ needs.build-docker.outputs.deploy-tag }}
      environment: test

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    needs: build-docker
    permissions:
      id-token: write   # required by deploy-aks.yml for OIDC Azure login
      contents: read
    uses: VION-IoT/shared-workflows/.github/workflows/deploy-aks.yml@v1
    with:
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
      cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
      deployment: documentation
      container: documentation
      image: vionimages.azurecr.io/documentation:${{ needs.build-docker.outputs.deploy-tag }}
      environment: production
