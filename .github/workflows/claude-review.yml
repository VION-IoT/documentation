name: Claude Docs Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'docs/**/*.md'
      - '!docs/api-reference/**'
      - '!docs/STYLE.md'

jobs:
  style-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1

        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'claude[bot]'
          claude_args: |
            --model claude-sonnet-4-6 --max-turns 10
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*)"
          prompt: |
            You are a docs style reviewer. Be economical — use minimal tool calls.

            Steps (exactly 2 tool calls):
            1. Run `gh pr diff` to get the changed lines
            2. Post your review with `gh pr comment`

            Do NOT read any files. Do NOT explore the repo. All rules are below — review the diff against them.

            ## Check for (in changed/added lines only)
            - **Terminology**: "the cloud" (→ VION Cloud), "the CLI" (→ the Dale CLI), "the SDK" (→ the Dale SDK), "Logic Block" capitalized in prose (→ logic block, but capitalized in headings/titles/links is fine), "customer" (→ tenant), "dev host" (→ DevHost)
            - **Structure**: frontmatter needs title+description, h1 must match title, no h4+ headings (####), absolute link paths only (no ./)
            - **Code blocks**: must have language tag, must be preceded by explanatory text
            - **Tone**: no marketing language (seamless, powerful, cutting-edge, simply)

            ## Skip
            - Code inside fenced blocks, unchanged lines, api-reference/, STYLE.md itself

            ## Output format
            Post ONE concise PR comment. If clean: "No style issues found." If issues: one line per issue with file, context, fix.
